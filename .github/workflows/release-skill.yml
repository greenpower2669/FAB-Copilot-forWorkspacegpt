name: Release FAB Copilot skill

on:
  push:
    branches:
      - main
    paths:
      - 'release-version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release-version.txt)"
          PLUGIN_VERSION="$(python -c 'import json; print(json.load(open("plugin.json", encoding="utf-8"))["version"])')"
          test "$VERSION" = "$PLUGIN_VERSION" || { echo "release-version.txt=$VERSION != plugin.json=$PLUGIN_VERSION"; exit 1; }
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build importable skill ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist-release
          mkdir -p build/fab-copilot/references dist-release
          cp skills/fab-copilot/SKILL.md build/fab-copilot/SKILL.md
          cp -R skills/fab-copilot/references/. build/fab-copilot/references/
          (
            cd build/fab-copilot
            zip -r "../../dist-release/fab-copilot-v${VERSION}-skill.zip" SKILL.md references
          )

      - name: Verify ZIP layout and current rules
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist-release/fab-copilot-v${VERSION}-skill.zip"
          unzip -l "$ZIP"
          unzip -p "$ZIP" SKILL.md | grep -q "FAB-DEBUG-001"
          unzip -p "$ZIP" SKILL.md | grep -q "FAB-MEM-004"
          unzip -p "$ZIP" SKILL.md | grep -q "FAB-APK-TEMP-001"
          unzip -p "$ZIP" SKILL.md | grep -q "FAB-REL-001"
          unzip -l "$ZIP" | grep -q "references/conventions.md"
          sha256sum "$ZIP" | tee "dist-release/fab-copilot-v${VERSION}-skill.zip.sha256"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="dist-release/fab-copilot-v${VERSION}-skill.zip"
          SUM="$ZIP.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SUM" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SUM"               --target "$GITHUB_SHA"               --title "FAB Copilot v${VERSION}"               --generate-notes
          fi
